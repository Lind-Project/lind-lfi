; Same policy as seccomp_blacklist_test.conf, for cages built with the LFI
; toolchain (musl). Their start-up and stdio use a few calls that the
; Wasm/glibc cages of Lind do not make as separate system calls: signal mask
; handling, writev (stdio), exit, brk (musl's allocator needs it to succeed),
; and the thread-pointer set-up (arch_prctl, set_tid_address).
;
; default policy is blacklist: everything not whitelisted is blocked.

[default]
blacklist

[whitelist]
SYS_open
SYS_exec
SYS_write
SYS_writev
SYS_close
SYS_unlink
SYS_futex
SYS_mmap
SYS_brk
SYS_munmap
SYS_sigaction
SYS_sigprocmask
SYS_exit
SYS_exit_group
SYS_arch_prctl
SYS_set_tid_address
SYS_set_robust_list
SYS_ioctl

[blacklist]
SYS_chmod

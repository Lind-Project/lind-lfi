; Same policy as seccomp_fs_deny.conf for cages built with the LFI toolchain
; (musl): its start-up, stdio and fork make a few more calls than the Wasm/glibc
; cages of Lind do (thread pointer set-up, signal masks, writev, brk, ...).
;
; Deny filesystem access by default.
; Whitelist only the syscalls needed for basic execution.
; Filesystem syscalls (open, mkdir, stat, etc.) are NOT whitelisted,
; so they return EPERM.

[default]
blacklist

[whitelist]
SYS_exec
SYS_fork
SYS_write
SYS_read
SYS_close
SYS_futex
SYS_mmap
SYS_munmap
SYS_exit_group
SYS_exit
SYS_getpid
SYS_waitpid
SYS_writev
SYS_sigprocmask
SYS_sigaction
SYS_brk
SYS_mprotect
SYS_arch_prctl
SYS_set_tid_address
SYS_set_robust_list
SYS_ioctl
SYS_madvise
SYS_sigaltstack
SYS_gettid
SYS_rt_sigreturn
SYS_fork_x86
SYS_vfork
SYS_poll
SYS_getrandom
SYS_clock_gettime
SYS_sched_getaffinity
SYS_sched_yield
SYS_fcntl
SYS_lseek
SYS_nanosleep_time64
SYS_getppid

[package]
name = "mtls-grate"
version = "0.1.0"
edition = "2024"

[dependencies]
grate-rs = { git = "https://github.com/Lind-Project/lind-wasm-example-grates", branch = "main", subdir = "lib/grate-rs" }
fdtables = { git = "https://github.com/Lind-Project/lind-wasm", branch = "main", subdir = "src/fdtables", default-features = false, features = ["muthashmax"] }
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-rustcrypto = "0.0.2-alpha"
rustls-pemfile = "2.1"
rustls-pki-types = "1.4"
clap = { version = "4.0", features = ["derive"] }
lazy_static = "1.4"
libc = "0.2"

# LFI: sandboxed code cannot use AVX2/SHA-NI (nor cpuid to detect them), so the
# crates that choose a backend at run time must use their portable one. For
# sha2 that is a feature (the other crates use cfgs, see lfi.rustflags).
sha2 = { version = "0.10", features = ["force-soft"] }
